seed = 42424242424424242
workers = 1
continue-on-failure = true
request-timeout = 30.0
# Tight path/body constraints cause the generator to filter out most candidates
# (tooling limitation, not an API defect).
suppress-health-check = ["filter_too_much"]

[generation]
mode = "all"
max-examples = 20
# Spring MVC ignores undeclared query/header extras (returns 200). Do not generate
# those mutations so negative_data_rejection can stay enabled for real schema
# violations (bad types, missing required fields, etc.).
allow-extra-parameters = false

[phases.stateful]
enabled = false

[phases.examples]
enabled = true

[phases.coverage]
enabled = true

[phases.fuzzing]
enabled = true

[reports.junit]
path = "./output/junit/junit.xml"

[reports.allure]
path = "./output/allure/results"

# Business rules (record-id format, FileSource paths, ACL contents, etc.) reject
# some Hypothesis values that still satisfy the OpenAPI schema. Treat 400 as an
# acceptable outcome for positive cases rather than disabling the check globally.
[checks.positive_data_acceptance]
expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

# Spring's default OPTIONS Allow lists methods for the matched handler pattern,
# which does not match OpenAPI's per-path method set. Not an API contract defect.
[checks.allow_header_conformance]
enabled = false
