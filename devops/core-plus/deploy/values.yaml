global:
  domain: ""
  # Host the HTTPRoute attaches to when httpRoute.hostnames is empty.
  hostname: ""
  limitsEnabled: true
  dataPartitionId: "osdu"

data:
  #Deployment
  requestsCpu: "5m"
  requestsMemory: "350Mi"
  limitsCpu: "1"
  limitsMemory: "1G"
  serviceAccountName: ""
  imagePullPolicy: "IfNotPresent"
  image: ""
  #Configmap
  logLevel: "ERROR"
  entitlementsHost: "http://entitlements"
  partitionHost: "http://partition"
  storageHost: "http://storage"

conf:
  configmap: "file-config"
  appName: "file"
  rabbitmqSecretName: "rabbitmq-secret"
  s3SecretName: "file-seaweedfs-secret"
  fileKeycloakSecretName: "file-keycloak-secret"
  filePostgresSecretName: "file-postgres-secret"
  replicas: 1

httpRoute:
  enabled: false
  # Route name. Defaults to "<release>-route" so it never collides with a route of the same name
  # defined outside this chart.
  name: ""
  parentRefs:
    - name: cimpl-gateway
      namespace: istio-system
  # Defaults to global.hostname when empty. The render fails when both are empty.
  hostnames: []
  # One rule per entry. Optional per entry: pathType (default PathPrefix), serviceName
  # (default conf.appName), port (default 80) and filters (for example URLRewrite).
  routes:
    - path: /api/file/

istio:
  proxyCPU: "5m"
  proxyCPULimit: "500m"
  proxyMemory: "50Mi"
  proxyMemoryLimit: "512Mi"
  sidecarInject: true
